<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Akhil & Manasa WatchList</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main class="page">
  <section class="hero" aria-label="Akhil and Manasa WatchList home">
    <div class="hero-content">
      <div class="brand">
        <h1>Akhil &amp; Manasa WatchList</h1>
        <p>Our universe. Our watchlist. Our journey. ❤️</p>
      </div>
      <div class="overall">
        <div class="overall-top"><strong id="overallPct">0%</strong><span id="overallCount">0 / 0 titles watched</span></div>
        <div class="bar"><div class="fill" id="overallFill"></div></div>
      </div>
    </div>
  </section>

  <section>
    <div class="section-head">
      <div><h2>Choose Your Universe</h2><p>Slide sideways, drag or use the arrows to choose where your next journey begins.</p></div>
      <div class="controls"><button class="arrow" id="prevBtn" aria-label="Previous">‹</button><button class="arrow" id="nextBtn" aria-label="Next">›</button></div>
    </div>
    <div class="profiles" id="profiles"></div>
  </section>
  <div class="footer">Akhil &amp; Manasa WatchList · Made for endless stories and unforgettable moments 💗</div>
</main>
<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
