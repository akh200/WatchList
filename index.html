<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WatchList</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            color: white;
            background: radial-gradient(circle at 20% 20%, rgba(255,0,80,.25), transparent 30%), radial-gradient(circle at 80% 30%, rgba(0,100,255,.25), transparent 30%), radial-gradient(circle at 50% 90%, rgba(150,0,255,.25), transparent 30%), #080808;
        }

        .container {
            width: 92%;
            max-width: 1400px;
            margin: auto;
            padding: 50px 0;
        }

        .hero {
            text-align: center;
            margin-bottom: 50px;
        }

            .hero h1 {
                font-size: clamp(40px, 7vw, 80px);
                font-weight: 900;
                letter-spacing: -3px;
                background: linear-gradient( 90deg, #ff3b3b, #ff9d00, #ffe600, #00e5ff, #8b5cff, #ff3b9d );
                -webkit-background-clip: text;
                color: transparent;
            }

            .hero p {
                margin-top: 15px;
                font-size: 20px;
                color: #bbb;
            }

        .progress-box {
            max-width: 700px;
            margin: 30px auto;
            padding: 20px;
            border-radius: 20px;
            background: rgba(255,255,255,.08);
            border: 1px solid rgba(255,255,255,.12);
            backdrop-filter: blur(15px);
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            color: #ddd;
        }

        .progress {
            height: 12px;
            background: #222;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            border-radius: 20px;
            background: linear-gradient( 90deg, #ff3b3b, #ff9d00, #00e5ff, #8b5cff );
            transition: width .5s ease;
        }

        .section-title {
            text-align: center;
            font-size: 30px;
            margin-bottom: 30px;
        }

        .profiles {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 25px;
        }

        .profile {
            position: relative;
            height: 300px;
            border-radius: 25px;
            overflow: hidden;
            cursor: pointer;
            background: #111;
            border: 2px solid rgba(255,255,255,.08);
            transition: transform .3s ease, box-shadow .3s ease, border .3s ease;
        }

            .profile:hover {
                transform: translateY(-10px) scale(1.02);
                border-color: rgba(255,255,255,.4);
                box-shadow: 0 20px 60px rgba(0,0,0,.6);
            }

        .profile-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            transition: transform .5s ease;
        }

        .profile:hover .profile-bg {
            transform: scale(1.08);
        }

        .profile-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient( to top, rgba(0,0,0,.95), rgba(0,0,0,.2), rgba(0,0,0,.1) );
        }

        .profile-content {
            position: absolute;
            bottom: 0;
            padding: 25px;
            width: 100%;
        }

            .profile-content h2 {
                font-size: 27px;
                margin-bottom: 7px;
            }

            .profile-content p {
                color: #ccc;
                font-size: 14px;
                line-height: 1.4;
            }

        .movie-count {
            display: inline-block;
            margin-top: 12px;
            padding: 6px 10px;
            border-radius: 20px;
            background: rgba(255,255,255,.15);
            font-size: 12px;
        }

        footer {
            text-align: center;
            margin-top: 70px;
            color: #777;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="hero">

            <h1>YOUR PERSONAL WATCHLIST</h1>

            <p>
                Choose a universe and continue your cinematic journey.
            </p>

            <div class="progress-box">

                <div class="progress-text">
                    <span id="progressPercent">0%</span>
                    <span id="progressCount">0 / 0 titles watched</span>
                </div>

                <div class="progress">
                    <div class="progress-fill"
                         id="progressFill">
                    </div>
                </div>

            </div>

        </div>


        <h2 class="section-title">
            PROFILES
        </h2>

        <div class="profiles"
             id="profiles">
        </div>


        <footer>
            WatchList · Your personal cinematic journey
        </footer>

    </div>


    <script src="data.js"></script>

    <script>

function getAllMovies() {

    let movies = [];

    universes.forEach(universe => {

        if (!universe.sections) return;

        universe.sections.forEach(section => {

            if (!section.items) return;

            section.items.forEach(movie => {
                movies.push(movie);
            });

        });

    });

    return movies;
}


function updateProgress() {

    const movies = getAllMovies();

    let watched = 0;

    movies.forEach(movie => {

        const status =
            localStorage.getItem("watchlist_" + movie.id);

        if (status === "watched") {
            watched++;
        }

    });

    const total = movies.length;

    const percent =
        total === 0
            ? 0
            : Math.round((watched / total) * 100);

    document.getElementById("progressPercent").textContent =
        percent + "%";

    document.getElementById("progressCount").textContent =
        watched + " / " + total + " titles watched";

    document.getElementById("progressFill").style.width =
        percent + "%";
}


function createProfiles() {

    const container =
        document.getElementById("profiles");

    container.innerHTML = "";

    universes.forEach(universe => {

        let totalMovies = 0;

        universe.sections.forEach(section => {

            totalMovies += section.items.length;

        });


        const card =
            document.createElement("div");

        card.className = "profile";


        card.innerHTML = `

            <div
                class="profile-bg"
                style="
                    background-image:
                    url('${universe.background}');
                ">
            </div>

            <div class="profile-overlay"></div>

            <div class="profile-content">

                <h2>
                    ${universe.name}
                </h2>

                <p>
                    ${universe.description}
                </p>

                <span class="movie-count">
                    ${totalMovies} titles
                </span>

            </div>
        `;


        card.onclick = function() {

            window.location.href =
                "universe.html?id=" +
                encodeURIComponent(universe.id);

        };


        container.appendChild(card);

    });
}


createProfiles();
updateProgress();

    </script>

</body>
</html>
