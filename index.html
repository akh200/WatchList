<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>WatchList — Your Universe</title>

    <meta name="description"
          content="Your personal movie and series universe tracker." />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
          rel="stylesheet">

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="bg-glow" aria-hidden="true"></div>

    <header class="main-header">

        ```
        <div>
            <p class="header-kicker">YOUR PERSONAL WATCHLIST</p>

            <h1>Choose Your Universe</h1>

            <p class="header-subtitle">
                Enter a universe and continue your journey.
            </p>
        </div>

        <div class="overall-progress">

            <div class="progress-circle">
                <span id="overallPct">0%</span>
            </div>

            <div>
                <strong id="overallCount">0 / 0</strong>
                <small>titles watched</small>
            </div>

        </div>
        ```

    </header>

    <main>

        ```
        <section class="profiles-section">

            <div class="section-heading">

                <div>
                    <p class="section-kicker">PROFILES</p>
                    <h2>Your Universes</h2>
                </div>

                <span id="profileCount"></span>

            </div>


            <div id="profiles" class="profiles-grid">
                <!-- Universe profiles are created by script.js -->
            </div>

        </section>
        ```

    </main>

    <footer class="site-footer">

        ```
        <p>
            WatchList · Your personal cinematic journey
        </p>

        <button id="resetAll" class="reset-btn" type="button">
            Reset all progress
        </button>
        ```

    </footer>

    <script src="data.js"></script>

    <script src="script.js"></script>

</body>
</html>
