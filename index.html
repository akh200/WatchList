<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WatchList — Your Cinematic Worlds</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: white;
            background: radial-gradient(circle at 20% 10%, rgba(120, 70, 255, .28), transparent 30%), radial-gradient(circle at 80% 20%, rgba(0, 200, 255, .18), transparent 28%), linear-gradient(135deg, #080812, #10101d 50%, #080812);
        }

            body::before {
                content: "";
                position: fixed;
                inset: 0;
                pointer-events: none;
                background: linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
                background-size: 40px 40px;
            }

        .hero {
            position: relative;
            padding: 70px 30px 45px;
            text-align: center;
        }

            .hero h1 {
                margin: 0;
                font-size: clamp(38px, 6vw, 76px);
                font-weight: 900;
                letter-spacing: -3px;
                background: linear-gradient(90deg, #fff, #b99cff, #64dcff);
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent;
            }

            .hero p {
                margin: 18px auto 0;
                max-width: 700px;
                color: #aaaabe;
                font-size: 18px;
            }

        .progress-wrap {
            width: min(700px, 90%);
            margin: 32px auto 0;
        }

        .progress-info {
            display: flex;
            justify-content: space-between;
            color: #bcbccc;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .progress-bar {
            height: 8px;
            border-radius: 99px;
            background: rgba(255,255,255,.1);
            overflow: hidden;
        }

        .progress-fill {
            width: 0%;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, #8b5cf6, #22d3ee);
            transition: width .4s ease;
        }

        .controls {
            position: relative;
            z-index: 2;
            width: min(1200px, 92%);
            margin: 0 auto 35px;
            display: flex;
            gap: 12px;
        }

        .search {
            flex: 1;
            padding: 15px 18px;
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,.1);
            outline: none;
            color: white;
            background: rgba(255,255,255,.07);
            backdrop-filter: blur(15px);
            font-size: 15px;
        }

            .search::placeholder {
                color: #858598;
            }

        .profiles {
            position: relative;
            z-index: 2;
            width: min(1400px, 94%);
            margin: auto;
            padding-bottom: 60px;
        }

        .section-title {
            margin: 0 0 22px;
            font-size: 27px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 22px;
        }

        .profile {
            position: relative;
            min-height: 220px;
            border-radius: 22px;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid rgba(255,255,255,.1);
            background: linear-gradient(145deg, var(--accent), #111);
            box-shadow: 0 18px 50px rgba(0,0,0,.35);
            transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
        }

            .profile::before {
                content: "";
                position: absolute;
                inset: 0;
                background: radial-gradient(circle at 80% 20%, var(--accent2), transparent 35%), linear-gradient(145deg, transparent, rgba(0,0,0,.75));
                opacity: .75;
            }

            .profile::after {
                content: "";
                position: absolute;
                inset: 0;
                background: radial-gradient(circle at 20% 80%, rgba(255,255,255,.15), transparent 25%);
                pointer-events: none;
            }

            .profile:hover {
                transform: translateY(-8px) scale(1.015);
                border-color: rgba(255,255,255,.35);
                box-shadow: 0 28px 65px rgba(0,0,0,.55);
            }

        .profile-content {
            position: relative;
            z-index: 2;
            height: 100%;
            min-height: 220px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .profile-icon {
            width: 58px;
            height: 58px;
            border-radius: 18px;
            display: grid;
            place-items: center;
            font-size: 28px;
            background: rgba(255,255,255,.14);
            border: 1px solid rgba(255,255,255,.2);
            backdrop-filter: blur(10px);
        }

        .profile-name {
            font-size: 25px;
            font-weight: 900;
            margin-top: 25px;
        }

        .profile-tagline {
            color: rgba(255,255,255,.7);
            font-size: 13px;
            line-height: 1.5;
            margin-top: 6px;
        }

        .profile-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }

        .count {
            color: rgba(255,255,255,.75);
            font-size: 13px;
        }

        .open {
            padding: 8px 12px;
            border-radius: 10px;
            background: rgba(255,255,255,.14);
            font-size: 12px;
            font-weight: bold;
        }

        .empty {
            display: none;
            text-align: center;
            color: #88889c;
            padding: 50px;
        }

        footer {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 30px;
            color: #686879;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .hero {
                padding-top: 45px;
            }

            .grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .profile {
                min-height: 190px;
            }

            .profile-content {
                min-height: 190px;
                padding: 16px;
            }

            .profile-name {
                font-size: 19px;
            }

            .profile-tagline {
                display: none;
            }

            .profile-icon {
                width: 45px;
                height: 45px;
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <header class="hero">
        <h1>YOUR CINEMATIC WORLDS</h1>

        <p>
            Choose a universe and continue your personal cinematic journey.
        </p>

        <div class="progress-wrap">
            <div class="progress-info">
                <span id="progressPercent">0%</span>
                <span id="progressText">0 / 0 titles watched</span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>
    </header>

    <div class="controls">
        <input class="search"
               id="search"
               type="text"
               placeholder="Search your cinematic worlds...">
    </div>

    <main class="profiles">

        <h2 class="section-title">PROFILES</h2>

        <div class="grid" id="universeGrid"></div>

        <div class="empty" id="empty">
            No cinematic world found.
        </div>

    </main>

    <footer>
        WatchList · Your personal cinematic journey
    </footer>

    <script src="./data.js"></script>

    <script>
    const grid = document.getElementById("universeGrid");
    const search = document.getElementById("search");
    const empty = document.getElementById("empty");

    const ICONS = {
        bolt: "⚡",
        shield: "🛡️",
        star: "⭐",
        planet: "🪐",
        wand: "🪄",
        ring: "💍",
        robot: "🤖",
        gorilla: "🦍",
        target: "🎯",
        hero: "🦸",
        dino: "🦖",
        pirate: "🏴‍☠️",
        lion: "🦁",
        car: "🏎️",
        gun: "🔫",
        water: "🌊",
        ape: "🐒",
        ghost: "👻",
        mask: "🎭",
        diamond: "💎"
    };

    function allItems(universe) {
        return universe.groups.flatMap(group => group.items);
    }

    function getStatus(item) {
        try {
            const saved = JSON.parse(localStorage.getItem("watchlist-progress") || "{}");
            return saved[item.id]?.status || "not-watched";
        } catch {
            return "not-watched";
        }
    }

    function getUniverseStats(universe) {
        const items = allItems(universe);

        const watched = items.filter(item =>
            getStatus(item) === "watched"
        ).length;

        return {
            total: items.length,
            watched
        };
    }

    function render(list = UNIVERSES) {

        grid.innerHTML = "";

        if (!list.length) {
            empty.style.display = "block";
            return;
        }

        empty.style.display = "none";

        list.forEach(universe => {

            const stats = getUniverseStats(universe);

            const card = document.createElement("div");
            card.className = "profile";

            card.style.setProperty("--accent", universe.accent);
            card.style.setProperty("--accent2", universe.accent2);

            card.innerHTML = `
                <div class="profile-content">

                    <div>
                        <div class="profile-icon">
                            ${ICONS[universe.icon] || "🎬"}
                        </div>

                        <div class="profile-name">
                            ${universe.name}
                        </div>

                        <div class="profile-tagline">
                            ${universe.tagline}
                        </div>
                    </div>

                    <div class="profile-bottom">

                        <div class="count">
                            ${stats.watched} / ${stats.total} watched
                        </div>

                        <div class="open">
                            OPEN →
                        </div>

                    </div>

                </div>
            `;

            card.addEventListener("click", () => {
                window.location.href =
                    `./universe.html?universe=${encodeURIComponent(universe.id)}`;
            });

            grid.appendChild(card);
        });
    }

    function updateOverallProgress() {

        const items = UNIVERSES.flatMap(allItems);

        const watched = items.filter(item =>
            getStatus(item) === "watched"
        ).length;

        const total = items.length;

        const percent = total
            ? Math.round((watched / total) * 100)
            : 0;

        document.getElementById("progressPercent").textContent =
            `${percent}%`;

        document.getElementById("progressText").textContent =
            `${watched} / ${total} titles watched`;

        document.getElementById("progressFill").style.width =
            `${percent}%`;
    }

    search.addEventListener("input", () => {

        const value = search.value.toLowerCase().trim();

        const filtered = UNIVERSES.filter(universe =>
            universe.name.toLowerCase().includes(value) ||
            universe.tagline.toLowerCase().includes(value)
        );

        render(filtered);
    });

    render();
    updateOverallProgress();
    </script>

</body>
</html>
