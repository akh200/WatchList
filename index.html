<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Akhil & Manasa WatchList</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        :root {
            --bg: #05070c;
            --text: #fff;
            --muted: #aeb4c2;
            --surface: rgba(16,19,29,.78);
            --border: rgba(255,255,255,.12)
        }

        body {
            min-height: 100vh;
            font-family: Arial,Helvetica,sans-serif;
            color: var(--text);
            background: radial-gradient(circle at 10% 10%,rgba(229,9,20,.22),transparent 30%),radial-gradient(circle at 90% 15%,rgba(0,100,255,.22),transparent 32%),radial-gradient(circle at 50% 100%,rgba(150,0,255,.18),transparent 35%),#05070c;
            overflow-x: hidden
        }

        .page {
            width: min(1500px,94%);
            margin: auto;
            padding: 24px 0 60px
        }

        /* HERO IMAGE */
        .hero-image {
            position: relative;
            min-height: 520px;
            border-radius: 30px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,.16);
            box-shadow: 0 30px 100px rgba(0,0,0,.55);
            background-image: linear-gradient(to bottom,rgba(0,0,0,.05) 0%,rgba(0,0,0,.08) 45%,rgba(5,7,12,.96) 100%),url('akhil-manasa-watchlist.png');
            background-size: cover;
            background-position: center top
        }

        .hero-glow {
            position: absolute;
            inset: auto 8% 0;
            height: 180px;
            background: radial-gradient(ellipse,rgba(0,180,255,.16),transparent 65%);
            pointer-events: none
        }

        .hero-bottom {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 24px 34px 28px;
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 25px;
            background: linear-gradient(to top,rgba(5,7,12,.96),rgba(5,7,12,.68),transparent)
        }

        .hero-copy h1 {
            font-size: clamp(30px,5vw,58px);
            line-height: 1;
            font-weight: 900;
            letter-spacing: -2px;
            background: linear-gradient(90deg,#ff7a00,#ffe600,#42e8ff,#b879ff,#ff5da2);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 8px 35px rgba(0,0,0,.6)
        }

        .hero-copy p {
            margin-top: 10px;
            color: #d7dbe4;
            font-size: 16px
        }

        .overall {
            min-width: 300px;
            padding: 17px 19px;
            border: 1px solid rgba(255,255,255,.16);
            border-radius: 18px;
            background: rgba(10,12,18,.74);
            backdrop-filter: blur(14px)
        }

        .overall-top {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 10px;
            color: #ddd;
            font-size: 14px
        }

            .overall-top strong {
                font-size: 22px;
                color: #fff
            }

        .bar {
            height: 10px;
            background: #242833;
            border-radius: 99px;
            overflow: hidden
        }

        .fill {
            height: 100%;
            width: 0;
            background: linear-gradient(90deg,#ff3b3b,#ffb000,#00d9ff,#9b6cff,#ff4fbd);
            border-radius: 99px;
            transition: width .4s
        }

        .section {
            margin-top: 34px
        }

        .section-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 18px
        }

        .section-title {
            font-size: 30px;
            letter-spacing: 1px
        }

        .section-sub {
            color: var(--muted);
            font-size: 14px
        }

        /* HORIZONTAL PROFILE CAROUSEL */
        .profiles-wrap {
            position: relative
        }

        .profiles {
            display: flex;
            gap: 18px;
            overflow-x: auto;
            scroll-behavior: smooth;
            scroll-snap-type: x mandatory;
            padding: 5px 4px 20px;
            scrollbar-width: none
        }

            .profiles::-webkit-scrollbar {
                display: none
            }

        .profile {
            position: relative;
            flex: 0 0 255px;
            height: 330px;
            border-radius: 24px;
            overflow: hidden;
            cursor: pointer;
            scroll-snap-align: start;
            border: 1px solid var(--border);
            background: linear-gradient(145deg,var(--accent),var(--accent2) 45%,#090b12 100%);
            box-shadow: 0 16px 45px rgba(0,0,0,.3);
            transition: transform .25s,border-color .25s,box-shadow .25s
        }

            .profile:hover {
                transform: translateY(-7px);
                border-color: var(--accent);
                box-shadow: 0 25px 60px rgba(0,0,0,.55)
            }

            .profile::before {
                content: "";
                position: absolute;
                inset: 0;
                background: radial-gradient(circle at 80% 15%,rgba(255,255,255,.22),transparent 26%),linear-gradient(to bottom,rgba(0,0,0,.03),rgba(0,0,0,.18) 35%,rgba(0,0,0,.95) 92%)
            }

        .profile-art {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 25%,rgba(255,255,255,.16),transparent 25%),linear-gradient(135deg,var(--accent),var(--accent2));
            opacity: .9
        }

        .profile-icon {
            position: absolute;
            top: 22px;
            left: 22px;
            width: 68px;
            height: 68px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 34px;
            background: rgba(0,0,0,.35);
            border: 1px solid rgba(255,255,255,.2);
            backdrop-filter: blur(10px)
        }

        .profile-content {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 22px
        }

            .profile-content h2 {
                font-size: 27px;
                margin-bottom: 7px
            }

            .profile-content p {
                font-size: 13px;
                line-height: 1.45;
                color: #d9dce4;
                min-height: 38px
            }

        .profile-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 14px;
            font-size: 12px;
            color: #ddd
        }

        .mini-bar {
            height: 6px;
            background: rgba(255,255,255,.16);
            border-radius: 99px;
            overflow: hidden;
            margin-top: 8px
        }

        .mini-fill {
            height: 100%;
            background: linear-gradient(90deg,var(--accent),var(--accent2));
            width: 0;
            transition: width .4s
        }

        .nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            z-index: 5;
            width: 44px;
            height: 44px;
            border: 1px solid rgba(255,255,255,.18);
            border-radius: 50%;
            background: rgba(7,9,14,.82);
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            backdrop-filter: blur(10px)
        }

            .nav:hover {
                background: var(--accent)
            }

            .nav.left {
                left: -12px
            }

            .nav.right {
                right: -12px
            }

        .hint {
            text-align: center;
            color: #777;
            font-size: 12px;
            margin-top: 3px
        }

        footer {
            text-align: center;
            color: #666;
            margin-top: 45px;
            font-size: 13px
        }

        @media(max-width:700px) {
            .page {
                width: 94%;
                padding-top: 12px
            }

            .hero-image {
                min-height: 430px;
                border-radius: 22px;
                background-position: center top
            }

            .hero-bottom {
                padding: 18px;
                display: block
            }

            .overall {
                margin-top: 16px;
                min-width: 0
            }

            .profile {
                flex-basis: 230px;
                height: 300px
            }

            .nav {
                display: none
            }

            .section-title {
                font-size: 25px
            }
        }
    </style>
</head>
<body>
    <div class="page">
        <section class="hero-image" aria-label="Akhil and Manasa WatchList">
            <div class="hero-glow"></div>
            <div class="hero-bottom">
                <div class="hero-copy">
                    <h1>Akhil &amp; Manasa WatchList</h1>
                    <p>Our universe. Our watchlist. Our journey. ❤️</p>
                </div>
                <div class="overall">
                    <div class="overall-top"><strong id="overallPercent">0%</strong><span id="overallCount">0 / 0 titles watched</span></div>
                    <div class="bar"><div class="fill" id="overallFill"></div></div>
                </div>
            </div>
        </section>

        <section class="section">
            <div class="section-head">
                <div><h2 class="section-title">Choose Your Universe</h2><p class="section-sub">Slide sideways and choose where your next journey begins.</p></div>
            </div>
            <div class="profiles-wrap">
                <button class="nav left" id="prevBtn" aria-label="Previous profiles">‹</button>
                <div class="profiles" id="profiles"></div>
                <button class="nav right" id="nextBtn" aria-label="Next profiles">›</button>
            </div>
            <div class="hint">← Drag / swipe sideways →</div>
        </section>

        <footer>Akhil &amp; Manasa WatchList · Made for endless stories and unforgettable moments 💗</footer>
    </div>

    <script src="data.js"></script>
    <script>(function(){
      'use strict';
      const STORAGE_KEY='watchlist-progress';
      const profiles=document.getElementById('profiles');
      const overallPercent=document.getElementById('overallPercent');
      const overallCount=document.getElementById('overallCount');
      const overallFill=document.getElementById('overallFill');

      let state={};
      try{state=JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')}catch(e){state={};}

      const icons={
        marvel:'⚡',dc:'🦇',horror:'👻',hp:'🪄',wizard:'🪄',anime:'☯',
        starwars:'✦',startrek:'🚀',transformers:'🤖',monsterverse:'🦖',
        missionimpossible:'🎯',invincible:'★',jurassic:'🦕',pirates:'☠',
        narnia:'🦁',fastfurious:'🏎',johnwick:'♠',terminator:'🤖',avatar:'🌊',
        apes:'🦍',conjuring:'🕯',insidious:'🚪',scream:'🔪',bond:'007'
      };

      function allItems(){
        if(!Array.isArray(window.UNIVERSES)) return [];
        return UNIVERSES.flatMap(u=>(u.groups||[]).flatMap(g=>g.items||[]));
      }
      function status(id){return state[id]||'not-watched';}
      function countUniverse(u){
        const items=(u.groups||[]).flatMap(g=>g.items||[]);
        const watched=items.filter(i=>status(i.id)==='watched').length;
        const halfway=items.filter(i=>status(i.id)==='halfway').length;
        return {total:items.length,watched,halfway};
      }
      function iconFor(u){
        const key=String(u.id||'').toLowerCase();
        return icons[key]||'🎬';
      }
      function createCard(u){
        const c=countUniverse(u);
        const pct=c.total?Math.round(c.watched/c.total*100):0;
        const card=document.createElement('article');
        card.className='profile';
        card.style.setProperty('--accent',u.accent||'#e50914');
        card.style.setProperty('--accent2',u.accent2||'#ffb000');
        card.innerHTML=`<div class="profile-art"></div><div class="profile-icon">${iconFor(u)}</div><div class="profile-content"><h2>${escapeHTML(u.name||'Universe')}</h2><p>${escapeHTML(u.tagline||'Your cinematic universe awaits.')}</p><div class="profile-meta"><span>${c.total} titles</span><strong>${pct}%</strong></div><div class="mini-bar"><div class="mini-fill" style="width:${pct}%"></div></div></div>`;
        card.addEventListener('click',()=>{localStorage.setItem('selected-universe',u.id);window.location.href='universe.html?universe='+encodeURIComponent(u.id);});
        return card;
      }
      function render(){
        profiles.innerHTML='';
        if(!Array.isArray(window.UNIVERSES)||!UNIVERSES.length){
          profiles.innerHTML='<div style="padding:30px;color:#aaa">No universes found. Make sure data.js is in this folder.</div>';
          return;
        }
        UNIVERSES.forEach(u=>profiles.appendChild(createCard(u)));
        updateOverall();
      }
      function updateOverall(){
        const items=allItems();
        const watched=items.filter(i=>status(i.id)==='watched').length;
        const pct=items.length?Math.round(watched/items.length*100):0;
        overallPercent.textContent=pct+'%';
        overallCount.textContent=watched+' / '+items.length+' titles watched';
        overallFill.style.width=pct+'%';
      }
      function escapeHTML(value){return String(value||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');}
      document.getElementById('prevBtn').addEventListener('click',()=>profiles.scrollBy({left:-520,behavior:'smooth'}));
      document.getElementById('nextBtn').addEventListener('click',()=>profiles.scrollBy({left:520,behavior:'smooth'}));
      render();
      window.addEventListener('storage',render);
    })();</script>
</body>
</html>
