<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Akhil & Manasa WatchList</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="page">

        <!-- =====================================================
             HOME / HERO
             The image already contains:
             "Akhil & Manasa WatchList"
             So DO NOT add another heading over it.
        ====================================================== -->

        <section class="hero" aria-label="Akhil and Manasa WatchList Home">

            <div class="hero-overlay"></div>

            <div class="hero-bottom">

                <div class="hero-message">
                    <p>
                        Our universe. Our watchlist. Our journey. ❤️
                    </p>
                </div>

                <div class="overall">

                    <div class="overall-top">

                        <strong id="overallPercent">
                            0%
                        </strong>

                        <span id="overallCount">
                            0 / 0 titles watched
                        </span>

                    </div>

                    <div class="bar">

                        <div class="fill"
                             id="overallFill">
                        </div>

                    </div>

                </div>

            </div>

        </section>


        <!-- =====================================================
             UNIVERSE PROFILES
        ====================================================== -->

        <section class="universe-section">

            <div class="section-head">

                <div>

                    <h2>
                        Choose Your Universe
                    </h2>

                    <p>
                        Slide sideways, drag or use the arrows
                        to choose where your next journey begins.
                    </p>

                </div>

            </div>


            <div class="profiles-wrapper">

                <button class="nav-button left"
                        id="prevBtn"
                        type="button"
                        aria-label="Previous universe">

                    ‹

                </button>


                <div class="profiles"
                     id="profiles">

                </div>


                <button class="nav-button right"
                        id="nextBtn"
                        type="button"
                        aria-label="Next universe">

                    ›

                </button>

            </div>


            <div class="slider-hint">

                ← Drag / Swipe Sideways →

            </div>

        </section>


        <!-- =====================================================
             FOOTER
        ====================================================== -->

        <footer>

            Akhil &amp; Manasa WatchList
            <span>•</span>
            Made for endless stories and unforgettable moments 💗

        </footer>

    </div>


    <!-- =========================================================
         IMPORTANT:
         data.js MUST LOAD BEFORE script.js
    ========================================================== -->

    <script src="data.js"></script>

    <script src="script.js"></script>

</body>

</html>
