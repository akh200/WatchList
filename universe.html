<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>WatchList</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            background: radial-gradient( circle at 10% 10%, rgba(255, 0, 80, .15), transparent 30% ), radial-gradient( circle at 90% 20%, rgba(0, 120, 255, .15), transparent 30% ), #080808;
            color: white;
        }


        /* =====================================================
           PAGE
        ===================================================== */

        #universePage {
            --accent: #e50914;
            --accent-2: #ffb000;
            min-height: 100vh;
        }


        .container {
            width: 92%;
            max-width: 1250px;
            margin: auto;
            padding: 35px 0 80px;
        }


        /* =====================================================
           TOP BAR
        ===================================================== */

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }


        .logo {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: -1px;
        }


            .logo span {
                color: var(--accent);
            }


        .back-button {
            border: none;
            background: rgba(255,255,255,.08);
            color: white;
            padding: 11px 18px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 14px;
            transition: .25s;
        }


            .back-button:hover {
                background: var(--accent);
                transform: translateX(-3px);
            }


        /* =====================================================
           HERO
        ===================================================== */

        .hero {
            padding: 45px 35px;
            border-radius: 30px;
            background: linear-gradient( 135deg, color-mix( in srgb, var(--accent) 30%, #111 ), rgba(255,255,255,.04) );
            border: 1px solid rgba(255,255,255,.1);
            margin-bottom: 35px;
            position: relative;
            overflow: hidden;
        }


            .hero::after {
                content: "";
                position: absolute;
                width: 300px;
                height: 300px;
                right: -100px;
                top: -100px;
                border-radius: 50%;
                background: var(--accent);
                opacity: .15;
                filter: blur(40px);
            }


            .hero h1 {
                font-size: clamp( 40px, 7vw, 76px );
                font-weight: 900;
                letter-spacing: -3px;
                background: linear-gradient( 90deg, var(--accent), var(--accent-2), white );
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent;
                margin-bottom: 12px;
            }


            .hero p {
                color: #aaa;
                font-size: 18px;
            }


        /* =====================================================
           PROGRESS
        ===================================================== */

        .progress-box {
            margin-top: 30px;
        }


        .progress-text {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            color: #ccc;
            margin-bottom: 10px;
            font-size: 14px;
        }


        .progress {
            height: 12px;
            border-radius: 20px;
            overflow: hidden;
            background: rgba(255,255,255,.08);
        }


        #universeProgressFill {
            height: 100%;
            width: 0%;
            border-radius: 20px;
            background: linear-gradient( 90deg, var(--accent), var(--accent-2) );
            transition: width .4s ease;
        }


        /* =====================================================
           MOVIE GROUP
        ===================================================== */

        .movie-group {
            margin-top: 45px;
        }


        .movie-group-title {
            font-size: 25px;
            margin-bottom: 18px;
            color: #eee;
        }


        /* =====================================================
           MOVIE LIST
        ===================================================== */

        .movie-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }


        /* =====================================================
           MOVIE CARD
        ===================================================== */

        .movie-card {
            display: grid;
            grid-template-columns: 55px 1fr auto;
            gap: 20px;
            align-items: center;
            padding: 22px;
            border-radius: 20px;
            background: linear-gradient( 135deg, rgba(255,255,255,.055), rgba(255,255,255,.025) );
            border: 1px solid rgba(255,255,255,.08);
            transition: transform .25s, border .25s, box-shadow .25s;
        }


            .movie-card:hover {
                transform: translateY(-3px);
                border-color: var(--accent);
                box-shadow: 0 15px 40px rgba(0,0,0,.3);
            }


        /* =====================================================
           NUMBER
        ===================================================== */

        .movie-number {
            width: 45px;
            height: 45px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient( 135deg, var(--accent), var(--accent-2) );
            font-weight: 900;
        }


        /* =====================================================
           INFO
        ===================================================== */

        .movie-title {
            font-size: 19px;
            margin-bottom: 7px;
        }


        .movie-year {
            color: #888;
            font-size: 14px;
            font-weight: normal;
            margin-left: 6px;
        }


        .movie-description {
            color: #999;
            line-height: 1.5;
            font-size: 14px;
            max-width: 700px;
        }


        /* =====================================================
           DETAILS
        ===================================================== */

        .movie-details {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 15px;
            flex-wrap: wrap;
        }


        /* =====================================================
           RATING
        ===================================================== */

        .rating-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
        }


        .rating-label {
            font-size: 10px;
            color: #777;
            text-transform: uppercase;
        }


        .rating-stars {
            display: flex;
            gap: 1px;
        }


        .rating-star {
            border: none;
            background: transparent;
            color: #777;
            cursor: pointer;
            font-size: 20px;
            padding: 0 2px;
        }


            .rating-star:hover {
                color: #ffd43b;
            }


        /* =====================================================
           TRAILER
        ===================================================== */

        .trailer-button {
            border: 1px solid rgba(255,255,255,.15);
            background: rgba(255,255,255,.06);
            color: white;
            padding: 10px 15px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: .2s;
        }


            .trailer-button:hover {
                background: #ff0000;
                border-color: #ff0000;
            }


        /* =====================================================
           STATUS
        ===================================================== */

        .status-button {
            border: none;
            padding: 10px 15px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            min-width: 125px;
            transition: .2s;
        }


        .status-not-watched {
            background: rgba(255,255,255,.08);
            color: #bbb;
        }


        .status-halfway {
            background: #f5a900;
            color: #111;
        }


        .status-watched {
            background: #25c26e;
            color: white;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media ( max-width: 800px ) {

            .movie-card {
                grid-template-columns: 45px 1fr;
            }


            .movie-details {
                grid-column: 2;
                justify-content: flex-start;
            }


            .hero {
                padding: 30px 22px;
            }
        }


        @media ( max-width: 550px ) {

            .container {
                width: 94%;
            }


            .movie-card {
                padding: 16px;
            }


            .movie-details {
                flex-direction: column;
                align-items: flex-start;
            }


            .progress-text {
                flex-direction: column;
                gap: 5px;
            }
        }
    </style>

</head>


<body>

    <div id="universePage">

        <div class="container">


            <!-- TOP BAR -->

            <div class="topbar">

                <div class="logo">

                    WATCH<span>LIST</span>

                </div>


                <button id="backButton"
                        class="back-button"
                        type="button">
                    ← Profiles
                </button>

            </div>



            <!-- HERO -->

            <section class="hero">

                <h1 id="universeTitle">
                    Loading...
                </h1>

                <p id="universeTagline">
                    Loading universe...
                </p>


                <div class="progress-box">

                    <div class="progress-text">

                        <span>
                            Your Progress
                        </span>

                        <span id="universeProgressText">
                            0 watched ·
                            0 halfway ·
                            0 remaining
                        </span>

                    </div>


                    <div class="progress">

                        <div id="universeProgressFill"></div>

                    </div>

                </div>

            </section>



            <!-- MOVIES -->

            <main id="movieGroups">

            </main>


        </div>

    </div>



    <!-- IMPORTANT:
         data.js MUST load before universe.js
    -->

    <script src="data.js"></script>

    <script src="universe.js"></script>


</body>

</html>
