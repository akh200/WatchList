<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>WatchList</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            min-height: 100vh;
            font-family: Arial, Helvetica, sans-serif;
            color: white;
            background: radial-gradient( circle at 10% 0%, var(--accent), transparent 25% ), radial-gradient( circle at 90% 10%, var(--accent2), transparent 25% ), #080808;
        }


        .page {
            min-height: 100vh;
            background: rgba(0,0,0,.55);
        }


        /* =========================
           HEADER
        ========================= */

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 5%;
            background: rgba(5,5,5,.85);
            backdrop-filter: blur(18px);
            border-bottom: 1px solid rgba(255,255,255,.1);
        }


        .logo {
            font-size: 24px;
            font-weight: 900;
        }


            .logo span {
                color: #e50914;
            }


        .back-button {
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            color: white;
            background: rgba(255,255,255,.12);
            cursor: pointer;
        }


            .back-button:hover {
                background: rgba(255,255,255,.25);
            }


        /* =========================
           HERO
        ========================= */

        .hero {
            width: 90%;
            max-width: 1400px;
            margin: auto;
            padding: 60px 0 30px;
        }


            .hero h1 {
                font-size: clamp( 42px, 7vw, 80px );
                font-weight: 900;
                background: linear-gradient( 90deg, white, var(--accent2), white );
                -webkit-background-clip: text;
                background-clip: text;
                color: transparent;
            }


            .hero p {
                margin-top: 12px;
                max-width: 800px;
                color: #bbb;
                font-size: 18px;
                line-height: 1.6;
            }


        /* =========================
           PROGRESS
        ========================= */

        .progress-box {
            margin-top: 25px;
            padding: 20px;
            border-radius: 18px;
            background: rgba(255,255,255,.06);
            border: 1px solid rgba(255,255,255,.1);
        }


        .progress-text {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
            color: #ddd;
        }


        .progress {
            height: 10px;
            border-radius: 20px;
            overflow: hidden;
            background: #222;
        }


        .progress-fill {
            width: 0%;
            height: 100%;
            border-radius: 20px;
            background: linear-gradient( 90deg, var(--accent), var(--accent2), #fff );
            transition: width .4s ease;
        }


        /* =========================
           ORDER
        ========================= */

        .controls {
            width: 90%;
            max-width: 1400px;
            margin: 10px auto 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }


        .filters {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }


        .filter {
            border: none;
            padding: 9px 15px;
            border-radius: 20px;
            background: #252525;
            color: white;
            cursor: pointer;
        }


            .filter.active {
                background: var(--accent);
            }


        /* =========================
           GROUPS
        ========================= */

        #movieGroups {
            width: 90%;
            max-width: 1400px;
            margin: auto;
            padding-bottom: 80px;
        }


        .movie-group {
            margin-bottom: 45px;
        }


        .movie-group-title {
            font-size: 27px;
            margin-bottom: 18px;
            color: var(--accent2);
        }


        .movie-list {
            display: grid;
            gap: 16px;
        }


        /* =========================
           MOVIE CARD
        ========================= */

        .movie-card {
            display: grid;
            grid-template-columns: 55px 1fr auto;
            align-items: center;
            gap: 20px;
            padding: 20px;
            border-radius: 18px;
            background: linear-gradient( 110deg, rgba(255,255,255,.08), rgba(255,255,255,.025) );
            border: 1px solid rgba(255,255,255,.1);
            transition: transform .2s ease, border .2s ease;
        }


            .movie-card:hover {
                transform: translateX(5px);
                border-color: var(--accent);
            }


        .movie-number {
            width: 45px;
            height: 45px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 13px;
            background: rgba(255,255,255,.07);
            color: var(--accent2);
            font-weight: bold;
        }


        .movie-title {
            font-size: 19px;
            font-weight: 800;
        }


        .movie-year {
            margin-left: 10px;
            color: #777;
            font-size: 13px;
            font-weight: normal;
        }


        .movie-description {
            margin-top: 8px;
            max-width: 850px;
            color: #aaa;
            font-size: 14px;
            line-height: 1.55;
        }


        /* =========================
           DETAILS
        ========================= */

        .movie-details {
            display: flex;
            align-items: center;
            gap: 10px;
        }


        .trailer-button {
            border: none;
            padding: 10px 14px;
            border-radius: 10px;
            background: #fff;
            color: #111;
            font-weight: bold;
            cursor: pointer;
        }


            .trailer-button:hover {
                background: var(--accent2);
                color: white;
            }


        .status-button {
            min-width: 125px;
            border: none;
            padding: 10px 14px;
            border-radius: 10px;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }


        .status-not-watched {
            background: #333;
        }


        .status-halfway {
            background: #e39b00;
        }


        .status-watched {
            background: #199447;
        }


        /* =========================
           RATING
        ========================= */

        .rating-wrapper {
            display: flex;
            align-items: center;
            gap: 5px;
        }


        .rating-label {
            display: none;
        }


        .rating-star {
            border: none;
            background: none;
            color: #555;
            font-size: 20px;
            padding: 0;
            cursor: pointer;
        }


            .rating-star:hover,
            .rating-star:focus {
                color: #ffd21f;
            }


        /* =========================
           MOBILE
        ========================= */

        @media(max-width:800px) {

            .movie-card {
                grid-template-columns: 45px 1fr;
            }


            .movie-details {
                grid-column: 1 / -1;
                flex-wrap: wrap;
            }
        }


        @media(max-width:550px) {

            .hero {
                padding-top: 40px;
            }


            .movie-card {
                padding: 15px;
            }


            .movie-title {
                font-size: 16px;
            }


            .movie-description {
                font-size: 12px;
            }


            .trailer-button,
            .status-button {
                font-size: 11px;
            }
        }
    </style>

</head>


<body>


    <div id="universePage"
         class="page">


        <header>

            <div class="logo">

                WATCH<span>LIST</span>

            </div>


            <button id="backButton"
                    class="back-button">

                ← Profiles

            </button>

        </header>


        <section class="hero">

            <h1 id="universeTitle">
                Loading...
            </h1>


            <p id="universeTagline">
                Loading universe...
            </p>


            <div class="progress-box">

                <div class="progress-text">

                    <span>
                        Your Progress
                    </span>

                    <span id="universeProgressText">
                        0 watched ·
                        0 halfway ·
                        0 remaining
                    </span>

                </div>


                <div class="progress">

                    <div id="universeProgressFill"
                         class="progress-fill">
                    </div>

                </div>

            </div>

        </section>


        <section class="controls">


            <div class="filters">

                <button class="filter active"
                        data-filter="all">
                    All
                </button>


                <button class="filter"
                        data-filter="not-watched">
                    ○ Not Watched
                </button>


                <button class="filter"
                        data-filter="halfway">
                    ◐ Halfway
                </button>


                <button class="filter"
                        data-filter="watched">
                    ✓ Watched
                </button>

            </div>


        </section>


        <main id="movieGroups">
        </main>


    </div>


    <!-- IMPORTANT ORDER -->

    <script src="data.js"></script>

    <script src="universe.js"></script>


</body>

</html>
