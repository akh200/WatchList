<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>WatchList</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            margin: 0;
            background: radial-gradient( circle at 10% 0%, rgba(80, 20, 90, .35), transparent 35% ), radial-gradient( circle at 90% 10%, rgba(10, 60, 120, .35), transparent 35% ), #05070c;
            color: #f5f5f5;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
        }

        /* =================================================
           HEADER
           ================================================= */

        header {
            height: 78px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5%;
            background: rgba(5, 7, 12, .92);
            border-bottom: 1px solid rgba(255,255,255,.08);
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(16px);
        }

        .logo {
            font-size: 27px;
            font-weight: 900;
            letter-spacing: -1px;
        }

            .logo span {
                color: #e50914;
            }

        #backButton {
            border: 0;
            background: rgba(255,255,255,.08);
            color: white;
            padding: 11px 18px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 700;
            transition: .2s ease;
        }

            #backButton:hover {
                background: rgba(255,255,255,.16);
                transform: translateY(-1px);
            }

        /* =================================================
           MAIN
           ================================================= */

        main {
            width: min( 1250px, 90% );
            margin: 0 auto 80px;
        }

        /* =================================================
           HERO
           ================================================= */

        #universeHero {
            min-height: 360px;
            margin-top: 35px;
            padding: 55px;
            border-radius: 30px;
            display: flex;
            align-items: flex-end;
            background: linear-gradient( 135deg, #151a2b, #211020 );
            background-size: cover;
            background-position: center;
            border: 1px solid rgba(255,255,255,.12);
            overflow: hidden;
            position: relative;
            box-shadow: 0 25px 80px rgba(0,0,0,.45);
        }

            #universeHero::after {
                content: "";
                position: absolute;
                inset: 0;
                background: linear-gradient( 0deg, rgba(5,7,12,.98), transparent 75% );
                pointer-events: none;
            }

        .hero-content {
            position: relative;
            z-index: 2;
            max-width: 800px;
        }

        .eyebrow {
            color: #ff3d71;
            text-transform: uppercase;
            letter-spacing: 3px;
            font-size: 13px;
            font-weight: 800;
            margin-bottom: 10px;
        }

        #universeTitle {
            font-size: clamp( 42px, 7vw, 78px );
            line-height: .95;
            margin: 0 0 20px;
            font-weight: 950;
            background: linear-gradient( 90deg, #ffffff, #ff426e, #ffb347 );
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        #universeDescription {
            color: rgba(255,255,255,.72);
            font-size: 18px;
            line-height: 1.6;
            margin: 0;
        }

        /* =================================================
           PROGRESS
           ================================================= */

        .progress-box {
            margin-top: 28px;
            padding: 22px 25px;
            border-radius: 20px;
            background: rgba(255,255,255,.045);
            border: 1px solid rgba(255,255,255,.1);
            backdrop-filter: blur(15px);
        }

        .progress-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            color: rgba(255,255,255,.75);
            font-size: 14px;
        }

        #progressText {
            display: flex;
            gap: 18px;
            align-items: center;
        }

            #progressText strong {
                color: #ff4f75;
                font-size: 18px;
            }

        .progress-bar {
            height: 10px;
            background: rgba(255,255,255,.08);
            border-radius: 20px;
            overflow: hidden;
        }

        #progressFill {
            width: 0%;
            height: 100%;
            background: linear-gradient( 90deg, #ff1744, #ff7a00, #ffd000 );
            border-radius: inherit;
            transition: width .4s ease;
        }

        /* =================================================
           FILTERS
           ================================================= */

        .filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 35px 0 30px;
        }

        .filter-button {
            border: 1px solid rgba(255,255,255,.1);
            background: rgba(255,255,255,.05);
            color: rgba(255,255,255,.75);
            padding: 10px 17px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 700;
            transition: .2s ease;
        }

            .filter-button:hover {
                background: rgba(255,255,255,.1);
            }

            .filter-button.active {
                background: linear-gradient( 135deg, #ff1744, #ff6a00 );
                color: white;
                border-color: transparent;
                box-shadow: 0 7px 25px rgba(255,40,70,.25);
            }

        /* =================================================
           GROUPS
           ================================================= */

        .movie-group {
            margin-bottom: 48px;
        }

        .group-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding: 0 5px;
        }

            .group-heading > div {
                display: flex;
                align-items: center;
                gap: 13px;
            }

            .group-heading h2 {
                margin: 0;
                font-size: 25px;
            }

        .group-number {
            width: 35px;
            height: 35px;
            display: grid;
            place-items: center;
            border-radius: 10px;
            background: linear-gradient( 135deg, #ff1744, #ff8a00 );
            font-weight: 900;
        }

        .group-count {
            color: rgba(255,255,255,.45);
            font-size: 13px;
        }

        /* =================================================
           MOVIE CARD
           ================================================= */

        .movie-list {
            display: grid;
            gap: 16px;
        }

        .movie-card {
            display: flex;
            min-height: 225px;
            border-radius: 22px;
            overflow: hidden;
            background: linear-gradient( 135deg, rgba(22,26,39,.96), rgba(14,17,27,.96) );
            border: 1px solid rgba(255,255,255,.08);
            box-shadow: 0 10px 35px rgba(0,0,0,.25);
            transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
        }

            .movie-card:hover {
                transform: translateY(-3px);
                border-color: rgba(255,80,100,.35);
                box-shadow: 0 18px 45px rgba(0,0,0,.4);
            }

        .movie-poster {
            width: 155px;
            min-width: 155px;
            background: linear-gradient( 135deg, #25283b, #11131e );
            overflow: hidden;
        }

            .movie-poster img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
                transition: transform .4s ease;
            }

        .movie-card:hover
        .movie-poster img {
            transform: scale(1.05);
        }

        .poster-placeholder {
            display: grid;
            place-items: center;
            font-size: 50px;
            color: rgba(255,255,255,.4);
        }

        .movie-content {
            display: flex;
            padding: 25px;
            gap: 18px;
            flex: 1;
        }

        .movie-number {
            width: 38px;
            min-width: 38px;
            height: 38px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            background: rgba(255,255,255,.07);
            color: rgba(255,255,255,.55);
            font-weight: 900;
        }

        .movie-main {
            flex: 1;
        }

        .movie-title-row {
            display: flex;
            align-items: baseline;
            gap: 10px;
            flex-wrap: wrap;
        }

            .movie-title-row h3 {
                margin: 0;
                font-size: 22px;
                color: white;
            }

        .movie-year {
            color: #ff9a5a;
            font-size: 14px;
            font-weight: 700;
        }

        .movie-type {
            margin-top: 7px;
            color: #ff5274;
            text-transform: uppercase;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1.5px;
        }

        .movie-description {
            color: rgba(255,255,255,.62);
            line-height: 1.6;
            margin: 13px 0 20px;
            max-width: 850px;
        }

        /* =================================================
           ACTIONS
           ================================================= */

        .movie-actions {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .status-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .status-button {
            border: 1px solid rgba(255,255,255,.1);
            background: rgba(255,255,255,.04);
            color: rgba(255,255,255,.65);
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 12px;
            font-weight: 700;
            transition: .2s ease;
        }

            .status-button:hover {
                background: rgba(255,255,255,.09);
                color: white;
            }

            .status-button.selected {
                background: rgba(255,170,0,.16);
                border-color: rgba(255,180,0,.5);
                color: #ffc107;
            }

                .status-button.selected.halfway {
                    background: rgba(255,170,0,.16);
                    color: #ffc107;
                }

                .status-button.selected.watched {
                    background: rgba(30,210,120,.15);
                    border-color: rgba(30,210,120,.45);
                    color: #55e695;
                }

        .movie-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .rating {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .rating-label {
            font-size: 12px;
            color: rgba(255,255,255,.4);
        }

        .rating-stars {
            display: flex;
            gap: 2px;
        }

        .rating-star {
            border: 0;
            background: transparent;
            color: rgba(255,255,255,.18);
            font-size: 20px;
            cursor: pointer;
            padding: 0 2px;
            transition: transform .15s ease, color .15s ease;
        }

            .rating-star:hover {
                transform: scale(1.2);
                color: #ffc107;
            }

            .rating-star.active {
                color: #ffc107;
            }

        .trailer-button {
            border: 0;
            background: linear-gradient( 135deg, #e50914, #ff4b2b );
            color: white;
            padding: 10px 16px;
            border-radius: 22px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(229,9,20,.2);
            transition: .2s ease;
        }

            .trailer-button:hover {
                transform: translateY(-2px);
                box-shadow: 0 10px 30px rgba(229,9,20,.35);
            }

        .no-trailer {
            color: rgba(255,255,255,.25);
            font-size: 12px;
        }

        /* =================================================
           TRAILER MODAL
           ================================================= */

        .trailer-modal {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: grid;
            place-items: center;
            padding: 25px;
        }

        .trailer-backdrop {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,.82);
            backdrop-filter: blur(8px);
        }

        .trailer-window {
            position: relative;
            z-index: 2;
            width: min( 1000px, 95vw );
            background: #10131d;
            border: 1px solid rgba(255,255,255,.15);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 30px 100px rgba(0,0,0,.7);
        }

        .trailer-heading {
            padding: 18px 25px;
            font-weight: 800;
            font-size: 18px;
        }

        .trailer-close {
            position: absolute;
            right: 15px;
            top: 12px;
            z-index: 3;
            width: 38px;
            height: 38px;
            border: 0;
            border-radius: 50%;
            background: rgba(0,0,0,.65);
            color: white;
            font-size: 25px;
            cursor: pointer;
        }

        .trailer-video {
            position: relative;
            padding-top: 56.25%;
            background: black;
        }

            .trailer-video iframe {
                position: absolute;
                inset: 0;
                width: 100%;
                height: 100%;
            }

        /* =================================================
           EMPTY / ERROR
           ================================================= */

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            color: rgba(255,255,255,.55);
        }

        .empty-icon {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .empty-state h2 {
            color: white;
        }

        .error-screen {
            min-height: 60vh;
            display: grid;
            place-items: center;
            text-align: center;
            padding: 40px;
        }

            .error-screen > div {
                max-width: 700px;
            }

        .error-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        .error-screen h1 {
            color: #ff4d6d;
            font-size: 35px;
        }

        .error-screen p {
            color: rgba(255,255,255,.6);
            line-height: 1.6;
        }

        .error-screen button {
            margin-top: 20px;
            padding: 12px 20px;
            border: 0;
            border-radius: 25px;
            background: #e50914;
            color: white;
            cursor: pointer;
            font-weight: 800;
        }

        /* =================================================
           LOADING
           ================================================= */

        #loading {
            position: fixed;
            inset: 0;
            z-index: 500;
            background: #05070c;
            display: grid;
            place-items: center;
            color: rgba(255,255,255,.6);
            transition: opacity .3s ease;
        }

            #loading.loaded {
                opacity: 0;
                pointer-events: none;
            }

        /* =================================================
           MOBILE
           ================================================= */

        @media (max-width: 700px) {

            header {
                height: 65px;
                padding: 0 18px;
            }

            .logo {
                font-size: 22px;
            }

            main {
                width: 94%;
            }

            #universeHero {
                min-height: 300px;
                padding: 30px 25px;
                margin-top: 20px;
                border-radius: 22px;
            }

            #universeTitle {
                font-size: 45px;
            }

            .progress-top {
                display: block;
            }

            #progressText {
                margin-top: 10px;
                flex-wrap: wrap;
                gap: 10px;
            }

            .movie-card {
                display: block;
            }

            .movie-poster {
                width: 100%;
                height: 260px;
            }

            .movie-content {
                padding: 20px;
            }

            .movie-number {
                display: none;
            }

            .movie-title-row h3 {
                font-size: 20px;
            }

            .movie-bottom {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>

</head>

<body>

    <!-- =================================================
         HEADER
         ================================================= -->

    <header>

        <div class="logo">
            WATCH<span>LIST</span>
        </div>

        <button id="backButton"
                type="button">
            ← Profiles
        </button>

    </header>


    <!-- =================================================
         MAIN
         ================================================= -->

    <main>

        <!-- HERO -->

        <section id="universeHero">

            <div class="hero-content">

                <div class="eyebrow">
                    Your Cinematic Universe
                </div>

                <h1 id="universeTitle">
                    Loading...
                </h1>

                <p id="universeDescription">
                    Loading universe...
                </p>

            </div>

        </section>


        <!-- PROGRESS -->

        <section class="progress-box">

            <div class="progress-top">

                <span>
                    Your Progress
                </span>

                <div id="progressText">
                    <span>
                        0 watched
                    </span>

                    <span>
                        0 halfway
                    </span>

                    <span>
                        0 remaining
                    </span>

                    <strong>
                        0%
                    </strong>
                </div>

            </div>

            <div class="progress-bar">

                <div id="progressFill"></div>

            </div>

        </section>


        <!-- FILTERS -->

        <div class="filters">

            <button id="filterAll"
                    class="filter-button active"
                    type="button">
                All
            </button>

            <button id="filterUnwatched"
                    class="filter-button"
                    type="button">
                ○ Not Watched
            </button>

            <button id="filterHalfway"
                    class="filter-button"
                    type="button">
                ◐ Halfway
            </button>

            <button id="filterWatched"
                    class="filter-button"
                    type="button">
                ✓ Watched
            </button>

        </div>


        <!-- MOVIES -->

        <div id="movieGroups"></div>

    </main>


    <!-- =================================================
         LOADING SCREEN
         ================================================= -->

    <div id="loading">
        Loading universe...
    </div>


    <!-- =================================================
         VERY IMPORTANT:
         data.js MUST LOAD FIRST
         universe.js MUST LOAD SECOND
         ================================================= -->

    <script src="data.js"></script>

    <script src="universe.js"></script>

</body>

</html>
