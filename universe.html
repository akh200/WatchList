<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>WatchList</title>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            font-family: Arial, Helvetica, sans-serif;
            background: radial-gradient( circle at top left, rgba(255,0,100,.18), transparent 35% ), radial-gradient( circle at bottom right, rgba(0,100,255,.18), transparent 35% ), #080808;
            color: white;
            min-height: 100vh;
        }


        .container {
            width: 92%;
            max-width: 1400px;
            margin: auto;
            padding: 35px 0 80px;
        }


        .back {
            display: inline-block;
            margin-bottom: 30px;
            padding: 10px 18px;
            border-radius: 20px;
            background: rgba(255,255,255,.1);
            color: white;
            text-decoration: none;
            cursor: pointer;
        }


        .hero {
            padding: 50px 30px;
            border-radius: 30px;
            margin-bottom: 40px;
            position: relative;
            overflow: hidden;
            background: linear-gradient( 135deg, rgba(255,0,80,.3), rgba(0,100,255,.2), rgba(100,0,255,.3) );
            border: 1px solid rgba(255,255,255,.15);
            backdrop-filter: blur(20px);
        }


            .hero h1 {
                font-size: clamp(40px, 7vw, 80px);
                font-weight: 900;
                margin-bottom: 15px;
            }


            .hero p {
                max-width: 800px;
                color: #ccc;
                font-size: 18px;
                line-height: 1.6;
            }


        .progress-box {
            margin-top: 30px;
            max-width: 600px;
        }


        .progress-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            color: #ccc;
        }


        .progress {
            height: 12px;
            background: #222;
            border-radius: 20px;
            overflow: hidden;
        }


        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient( 90deg, #ff3b3b, #ff9900, #00e5ff, #8b5cff );
            transition: width .5s ease;
        }


        .section {
            margin-bottom: 50px;
        }


        .section-title {
            font-size: 32px;
            margin-bottom: 20px;
        }


        .movie-grid {
            display: grid;
            grid-template-columns: repeat( auto-fit, minmax(280px, 1fr) );
            gap: 25px;
        }


        .movie {
            background: rgba(255,255,255,.06);
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 22px;
            overflow: hidden;
            transition: transform .3s ease, border .3s ease;
        }


            .movie:hover {
                transform: translateY(-7px);
                border-color: rgba(255,255,255,.35);
            }


        .movie-poster {
            height: 360px;
            position: relative;
            background-size: cover;
            background-position: center;
        }


        .movie-number {
            position: absolute;
            top: 15px;
            left: 15px;
            padding: 7px 12px;
            border-radius: 20px;
            background: rgba(0,0,0,.75);
            font-weight: bold;
        }


        .movie-info {
            padding: 20px;
        }


        .movie-title {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 7px;
        }


        .movie-year {
            color: #aaa;
            margin-bottom: 15px;
        }


        .description {
            color: #ccc;
            line-height: 1.5;
            font-size: 14px;
            min-height: 80px;
        }


        .trailer {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 16px;
            border-radius: 20px;
            background: linear-gradient( 90deg, #ff1744, #ff5722 );
            color: white;
            text-decoration: none;
            font-weight: bold;
        }


        .controls {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,.1);
        }


        .status-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }


        .status-btn {
            border: none;
            padding: 8px 12px;
            border-radius: 15px;
            background: rgba(255,255,255,.1);
            color: white;
            cursor: pointer;
            font-size: 12px;
        }


            .status-btn:hover {
                background: rgba(255,255,255,.2);
            }


            .status-btn.active {
                background: linear-gradient( 90deg, #00c853, #00e5ff );
                color: black;
                font-weight: bold;
            }


        .rating {
            margin-top: 12px;
            display: flex;
            gap: 5px;
        }


        .star {
            cursor: pointer;
            font-size: 23px;
            opacity: .35;
        }


            .star.active {
                opacity: 1;
            }


        .empty {
            padding: 50px;
            text-align: center;
            color: #aaa;
        }
    </style>

</head>


<body>


    <div class="container">


        <a class="back"
           href="index.html">

            ← Back to Profiles

        </a>


        <div class="hero"
             id="hero">

            <h1 id="universeTitle">
                WatchList
            </h1>

            <p id="universeDescription">
            </p>


            <div class="progress-box">

                <div class="progress-info">

                    <span id="progressPercent">
                        0%
                    </span>

                    <span id="progressCount">
                        0 / 0 watched
                    </span>

                </div>


                <div class="progress">

                    <div class="progress-fill"
                         id="progressFill">
                    </div>

                </div>

            </div>

        </div>


        <div id="content"></div>


    </div>


    <script src="data.js"></script>


    <script>


function getUniverse() {

    const params =
        new URLSearchParams(
            window.location.search
        );

    const id =
        params.get("id");


    return universes.find(
        universe =>
            universe.id === id
    );

}


function createMovie(movie, number) {

    const savedStatus =
        localStorage.getItem(
            "watchlist_" + movie.id
        ) || "unwatched";


    const savedRating =
        Number(
            localStorage.getItem(
                "rating_" + movie.id
            ) || 0
        );


    const card =
        document.createElement("div");

    card.className = "movie";


    card.innerHTML = `

        <div
            class="movie-poster"
            style="
                background-image:
                url('${movie.image}');
            ">

            <div class="movie-number">
                #${number}
            </div>

        </div>


        <div class="movie-info">

            <div class="movie-title">
                ${movie.title}
            </div>

            <div class="movie-year">
                ${movie.year}
            </div>

            <div class="description">
                ${movie.description}
            </div>


            <a
                class="trailer"
                href="${movie.trailer}"
                target="_blank">

                ▶ Watch Trailer

            </a>


            <div class="controls">

                <div class="status-buttons">

                    <button
                        class="status-btn
                        ${savedStatus === "unwatched" ? "active" : ""}"
                        onclick="
                            setStatus(
                                '${movie.id}',
                                'unwatched',
                                this
                            )">

                        ○ Not Watched

                    </button>


                    <button
                        class="status-btn
                        ${savedStatus === "half" ? "active" : ""}"
                        onclick="
                            setStatus(
                                '${movie.id}',
                                'half',
                                this
                            )">

                        ◐ Half Completed

                    </button>


                    <button
                        class="status-btn
                        ${savedStatus === "watched" ? "active" : ""}"
                        onclick="
                            setStatus(
                                '${movie.id}',
                                'watched',
                                this
                            )">

                        ✓ Watched

                    </button>

                </div>


                <div class="rating">

                    ${createStars(
                        movie.id,
                        savedRating
                    )}

                </div>

            </div>

        </div>
    `;


    return card;

}


function createStars(id, rating) {

    let html = "";


    for (
        let i = 1;
        i <= 5;
        i++
    ) {

        html += `

            <span
                class="star
                ${i <= rating ? "active" : ""}"
                onclick="
                    setRating(
                        '${id}',
                        ${i}
                    )">

                ★

            </span>

        `;

    }


    return html;

}


function setStatus(id, status, button) {

    localStorage.setItem(
        "watchlist_" + id,
        status
    );


    const parent =
        button.parentElement;


    parent
        .querySelectorAll(".status-btn")
        .forEach(btn =>
            btn.classList.remove("active")
        );


    button.classList.add("active");


    updateProgress();

}


function setRating(id, rating) {

    localStorage.setItem(
        "rating_" + id,
        rating
    );


    render();

}


function updateProgress() {

    const universe =
        getUniverse();


    if (!universe) return;


    let movies = [];


    universe.sections.forEach(
        section => {

            section.items.forEach(
                movie => {

                    movies.push(movie);

                }
            );

        }
    );


    let watched = 0;


    movies.forEach(
        movie => {

            if (
                localStorage.getItem(
                    "watchlist_" + movie.id
                ) === "watched"
            ) {

                watched++;

            }

        }
    );


    const total =
        movies.length;


    const percent =
        total === 0
            ? 0
            : Math.round(
                watched / total * 100
            );


    document.getElementById(
        "progressPercent"
    ).textContent =
        percent + "%";


    document.getElementById(
        "progressCount"
    ).textContent =
        watched +
        " / " +
        total +
        " watched";


    document.getElementById(
        "progressFill"
    ).style.width =
        percent + "%";

}


function render() {

    const universe =
        getUniverse();


    if (!universe) {

        document.getElementById(
            "content"
        ).innerHTML = `

            <div class="empty">

                Universe not found.

            </div>

        `;

        return;

    }


    document.title =
        universe.name +
        " · WatchList";


    document.getElementById(
        "universeTitle"
    ).textContent =
        universe.name;


    document.getElementById(
        "universeDescription"
    ).textContent =
        universe.description;


    const content =
        document.getElementById(
            "content"
        );


    content.innerHTML = "";


    universe.sections.forEach(
        section => {

            const sectionDiv =
                document.createElement("div");


            sectionDiv.className =
                "section";


            sectionDiv.innerHTML = `

                <h2 class="section-title">

                    ${section.name}

                </h2>

                <div class="movie-grid"></div>

            `;


            const grid =
                sectionDiv.querySelector(
                    ".movie-grid"
                );


            section.items.forEach(
                (movie, index) => {

                    grid.appendChild(
                        createMovie(
                            movie,
                            index + 1
                        )
                    );

                }
            );


            content.appendChild(
                sectionDiv
            );

        }
    );


    updateProgress();

}


render();


    </script>


</body>

</html>
