<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>WatchList — Universe</title>


    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
          rel="stylesheet">


    <!-- Main stylesheet -->

    <link rel="stylesheet"
          href="styles.css">


    <style>

            /* =====================================================
           PAGE
        ===================================================== */

            .universe-page {
                --accent: #e6483f;
                --accent-2: #f2a93c;
                min-height: 100vh;
                max-width: 1250px;
                margin: 0 auto;
                padding: 35px 30px 80px;
            }


            /* =====================================================
           BACK BUTTON
        ===================================================== */

            .back-button {
                display: inline-flex;
                align-items: center;
                gap: 7px;
                margin-bottom: 30px;
                padding: 10px 17px;
                border: 1px solid var(--border);
                border-radius: 999px;
                background: rgba(255,255,255,0.03);
                color: var(--text-dim);
                cursor: pointer;
                font-size: 0.78rem;
                font-weight: 600;
                transition: 0.2s ease;
            }


                .back-button:hover {
                    color: var(--text);
                    border-color: var(--accent);
                    transform: translateX(-3px);
                }


            /* =====================================================
           UNIVERSE HERO
        ===================================================== */

            .universe-header {
                position: relative;
                min-height: 300px;
                display: flex;
                align-items: flex-end;
                overflow: hidden;
                padding: 45px;
                border: 1px solid var(--border);
                border-radius: 28px;
                background: radial-gradient( circle at 85% 20%, var(--accent), transparent 32% ), radial-gradient( circle at 15% 100%, var(--accent-2), transparent 30% ), linear-gradient( 135deg, #171a22, #0b0d12 );
            }


                .universe-header::before {
                    content: "";
                    position: absolute;
                    width: 500px;
                    height: 500px;
                    right: -200px;
                    top: -280px;
                    border-radius: 50%;
                    background: var(--accent);
                    opacity: 0.16;
                    filter: blur(60px);
                }


                .universe-header::after {
                    content: "";
                    position: absolute;
                    inset: 0;
                    background: linear-gradient( 90deg, rgba(5,7,10,0.92), rgba(5,7,10,0.55), rgba(5,7,10,0.2) );
                    pointer-events: none;
                }


            .universe-header-content {
                position: relative;
                z-index: 2;
                width: 100%;
            }


            /* =====================================================
           KICKER
        ===================================================== */

            .header-kicker {
                display: inline-block;
                margin: 0 0 12px;
                color: var(--accent);
                font-size: 0.7rem;
                font-weight: 700;
                letter-spacing: 0.2em;
            }


            /* =====================================================
           TITLE
        ===================================================== */

            .universe-title {
                margin: 0;
                font-family: "Space Grotesk", sans-serif;
                font-size: clamp( 3rem, 8vw, 6.5rem );
                line-height: 0.9;
                letter-spacing: -0.06em;
                text-transform: uppercase;
                text-shadow: 0 10px 50px rgba(0,0,0,0.4);
            }


            .universe-tagline {
                max-width: 700px;
                margin: 20px 0 0;
                color: var(--text-dim);
                font-size: 0.95rem;
                line-height: 1.6;
            }


            /* =====================================================
           PROGRESS
        ===================================================== */

            .universe-progress {
                max-width: 700px;
                margin-top: 30px;
            }


            .universe-progress-info {
                display: flex;
                justify-content: space-between;
                gap: 20px;
                margin-bottom: 9px;
                color: var(--text-dim);
                font-size: 0.75rem;
            }


            .universe-progress-bar {
                height: 8px;
                overflow: hidden;
                border-radius: 999px;
                background: rgba(255,255,255,0.08);
            }


            .universe-progress-fill {
                height: 100%;
                width: 0;
                border-radius: inherit;
                background: linear-gradient( 90deg, var(--accent), var(--accent-2) );
                box-shadow: 0 0 18px var(--accent);
                transition: width 0.4s ease;
            }


            /* =====================================================
           MOVIE SECTION
        ===================================================== */

            .movie-section {
                margin-top: 55px;
            }


            .movie-section-header {
                display: flex;
                justify-content: space-between;
                align-items: flex-end;
                gap: 25px;
                margin-bottom: 25px;
            }


                .movie-section-header h2 {
                    margin: 0;
                    font-family: "Space Grotesk", sans-serif;
                    font-size: 1.8rem;
                    letter-spacing: -0.03em;
                }


                .movie-section-header p {
                    margin: 6px 0 0;
                    color: var(--text-faint);
                    font-size: 0.78rem;
                }


            /* =====================================================
           ORDER TOGGLE
        ===================================================== */

            .order-toggle {
                display: flex;
                align-items: center;
                gap: 5px;
                padding: 5px;
                border: 1px solid var(--border);
                border-radius: 999px;
                background: rgba(255,255,255,0.03);
                flex-shrink: 0;
            }


                .order-toggle button {
                    border: none;
                    border-radius: 999px;
                    padding: 10px 16px;
                    background: transparent;
                    color: var(--text-faint);
                    cursor: pointer;
                    font-family: "Inter", sans-serif;
                    font-size: 0.72rem;
                    font-weight: 600;
                    transition: 0.2s ease;
                }


                    .order-toggle button:hover {
                        color: var(--text);
                    }


                    .order-toggle button.active {
                        background: var(--accent);
                        color: #ffffff;
                        box-shadow: 0 4px 15px rgba(0,0,0,0.25);
                    }


            /* =====================================================
           MOVIE GROUP
        ===================================================== */

            .movie-group {
                margin-bottom: 40px;
            }


            .movie-group-title {
                display: flex;
                align-items: center;
                gap: 12px;
                margin: 0 0 15px;
                color: var(--text-dim);
                font-family: "Space Grotesk", sans-serif;
                font-size: 0.95rem;
                letter-spacing: 0.02em;
            }


                .movie-group-title::before {
                    content: "";
                    display: block;
                    width: 4px;
                    height: 20px;
                    border-radius: 4px;
                    background: linear-gradient( var(--accent), var(--accent-2) );
                }


            /* =====================================================
           MOVIE LIST
        ===================================================== */

            .movie-list {
                display: grid;
                gap: 10px;
            }


            /* =====================================================
           MOVIE CARD
        ===================================================== */

            .movie-card {
                position: relative;
                display: grid;
                grid-template-columns: 58px minmax(0,1fr) auto;
                align-items: center;
                gap: 18px;
                padding: 17px 20px;
                border: 1px solid var(--border);
                border-radius: 16px;
                background: linear-gradient( 120deg, rgba(255,255,255,0.035), rgba(255,255,255,0.015) );
                overflow: hidden;
                transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
            }


                .movie-card::before {
                    content: "";
                    position: absolute;
                    left: 0;
                    top: 0;
                    bottom: 0;
                    width: 3px;
                    background: linear-gradient( var(--accent), var(--accent-2) );
                    opacity: 0;
                    transition: opacity 0.2s ease;
                }


                .movie-card:hover {
                    transform: translateX(5px);
                    border-color: color-mix( in srgb, var(--accent) 55%, var(--border) );
                    background: rgba(255,255,255,0.055);
                }


                    .movie-card:hover::before {
                        opacity: 1;
                    }


            /* =====================================================
           MOVIE NUMBER
        ===================================================== */

            .movie-number {
                display: grid;
                place-items: center;
                width: 48px;
                height: 48px;
                border: 1px solid var(--border);
                border-radius: 13px;
                background: rgba(255,255,255,0.04);
                color: var(--text-faint);
                font-family: "Space Grotesk", sans-serif;
                font-size: 0.9rem;
                font-weight: 700;
            }


            /* =====================================================
           MOVIE INFO
        ===================================================== */

            .movie-info {
                min-width: 0;
            }


            .movie-title {
                margin: 0;
                color: var(--text);
                font-family: "Space Grotesk", sans-serif;
                font-size: 1rem;
                font-weight: 600;
                line-height: 1.35;
            }


            .movie-year {
                margin-left: 8px;
                color: var(--text-faint);
                font-family: "Inter", sans-serif;
                font-size: 0.72rem;
                font-weight: 400;
            }


            .movie-description {
                max-width: 750px;
                margin: 5px 0 0;
                color: var(--text-faint);
                font-size: 0.76rem;
                line-height: 1.5;
            }


            /* =====================================================
           DETAILS
        ===================================================== */

            .movie-details {
                display: flex;
                align-items: center;
                justify-content: flex-end;
                gap: 9px;
                flex-wrap: wrap;
            }


            /* =====================================================
           RATING
        ===================================================== */

            .rating-wrapper {
                display: flex;
                align-items: center;
                gap: 5px;
            }


            .rating-label {
                color: var(--text-faint);
                font-size: 0.65rem;
                white-space: nowrap;
            }


            .rating-stars {
                display: flex;
                align-items: center;
            }


            .rating-star {
                border: none;
                padding: 1px;
                background: transparent;
                color: var(--accent-2);
                cursor: pointer;
                font-size: 1rem;
                line-height: 1;
                transition: transform 0.15s ease;
            }


                .rating-star:hover {
                    transform: scale(1.2);
                }


            /* =====================================================
           BUTTONS
        ===================================================== */

            .trailer-button,
            .status-button {
                border: 1px solid var(--border);
                border-radius: 999px;
                padding: 8px 13px;
                cursor: pointer;
                font-family: "Inter", sans-serif;
                font-size: 0.68rem;
                font-weight: 600;
                transition: 0.2s ease;
                white-space: nowrap;
            }


            .trailer-button {
                background: rgba(255,255,255,0.03);
                color: var(--text-dim);
            }


                .trailer-button:hover {
                    border-color: var(--accent);
                    color: var(--text);
                    background: rgba(255,255,255,0.06);
                }


            /* =====================================================
           STATUS
        ===================================================== */

            .status-button {
                background: var(--surface-2);
                color: var(--text-dim);
            }


            .status-not-watched {
                color: var(--text-faint);
            }


            .status-halfway {
                border-color: #f2a93c;
                background: rgba(242,169,60,0.12);
                color: #f2a93c;
            }


            .status-watched {
                border-color: #4caf83;
                background: rgba(76,175,131,0.12);
                color: #72d5a7;
            }


            /* =====================================================
           CHRONOLOGICAL MODE
        ===================================================== */

            #movieGroups > .movie-list {
                margin-top: 5px;
            }


            /* =====================================================
           EMPTY STATE
        ===================================================== */

            .empty-state {
                padding: 50px 25px;
                border: 1px dashed var(--border);
                border-radius: 18px;
                color: var(--text-faint);
                text-align: center;
            }


            /* =====================================================
           MOBILE
        ===================================================== */

            @media (max-width: 900px) {

                .movie-card {
                    grid-template-columns: 50px minmax(0,1fr);
                }


                .movie-details {
                    grid-column: 2;
                    justify-content: flex-start;
                }
            }


            @media (max-width: 700px) {

                .universe-page {
                    padding: 22px 15px 50px;
                }


                .universe-header {
                    min-height: 280px;
                    padding: 30px 25px;
                    border-radius: 22px;
                }


                .universe-title {
                    font-size: clamp( 2.7rem, 16vw, 4.5rem );
                }


                .movie-section-header {
                    align-items: flex-start;
                    flex-direction: column;
                }


                .order-toggle {
                    width: 100%;
                }


                    .order-toggle button {
                        flex: 1;
                    }


                .movie-card {
                    grid-template-columns: 43px minmax(0,1fr);
                    gap: 13px;
                    padding: 15px;
                }


                .movie-number {
                    width: 40px;
                    height: 40px;
                }


                .movie-details {
                    grid-column: 2;
                    gap: 7px;
                }


                .movie-description {
                    font-size: 0.72rem;
                }


                .rating-wrapper {
                    width: 100%;
                }
            }


            @media (max-width: 430px) {

                .trailer-button,
                .status-button {
                    padding: 7px 10px;
                    font-size: 0.63rem;
                }


                .rating-label {
                    display: none;
                }
            }
    </style>

</head>


<body>


    <main id="universePage"
          class="universe-page">


        <!-- ===================================================
             BACK
        ==================================================== -->

        <button id="backButton"
                class="back-button"
                type="button">

            ← Back to Universes

        </button>


        <!-- ===================================================
             UNIVERSE HERO
        ==================================================== -->

        <section class="universe-header">

            <div class="universe-header-content">

                <div class="header-kicker">
                    YOUR UNIVERSE
                </div>


                <h1 id="universeTitle"
                    class="universe-title">
                    Loading...
                </h1>


                <p id="universeTagline"
                   class="universe-tagline">
                </p>


                <!-- PROGRESS -->

                <div class="universe-progress">

                    <div class="universe-progress-info">

                        <span>
                            Your Progress
                        </span>


                        <span id="universeProgressText">
                            0 watched · 0 halfway · 0 remaining
                        </span>

                    </div>


                    <div class="universe-progress-bar">

                        <div id="universeProgressFill"
                             class="universe-progress-fill">
                        </div>

                    </div>

                </div>

            </div>

        </section>


        <!-- ===================================================
             MOVIES
        ==================================================== -->

        <section class="movie-section">


            <div class="movie-section-header">

                <div>

                    <h2>
                        Watch Order
                    </h2>

                    <p>
                        Choose how you want to experience this universe.
                    </p>

                </div>


                <!--
                  universe.js automatically inserts:

                  Release Order
                  Chronological

                  here.
                -->

            </div>


            <!-- MOVIES ARE GENERATED BY universe.js -->

            <div id="movieGroups">

            </div>


        </section>


    </main>


    <!-- =====================================================
         DATA
    ====================================================== -->

    <script src="data.js"></script>


    <!-- =====================================================
         UNIVERSE LOGIC
    ====================================================== -->

    <script src="universe.js"></script>


</body>

</html>
