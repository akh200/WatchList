<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WatchList</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            color: white;
            min-height: 100vh;
            background: radial-gradient(circle at 10% 10%, #3b0d0d, transparent 35%), radial-gradient(circle at 90% 20%, #111c42, transparent 35%), linear-gradient(135deg, #050505, #101010);
        }

        /* HEADER */

        header {
            height: 75px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 5%;
            background: rgba(0,0,0,.75);
            backdrop-filter: blur(15px);
            border-bottom: 1px solid rgba(255,255,255,.1);
        }

        .logo {
            font-size: 27px;
            font-weight: 900;
        }

            .logo span {
                color: #e50914;
            }

        .back {
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            color: white;
            background: rgba(255,255,255,.12);
            cursor: pointer;
        }

            .back:hover {
                background: rgba(255,255,255,.25);
            }

        /* HERO */

        .hero {
            padding: 55px 5% 30px;
        }

            .hero h1 {
                font-size: clamp(40px,6vw,70px);
                font-weight: 900;
                margin-bottom: 12px;
            }

            .hero p {
                max-width: 750px;
                color: #bbb;
                font-size: 17px;
                line-height: 1.6;
            }

        /* PROGRESS */

        .progress {
            margin: 10px 5% 30px;
            padding: 20px;
            border-radius: 18px;
            background: rgba(255,255,255,.06);
            border: 1px solid rgba(255,255,255,.1);
        }

        .progressTop {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .progressBar {
            width: 100%;
            height: 9px;
            background: #292929;
            border-radius: 20px;
            overflow: hidden;
        }

        .progressFill {
            height: 100%;
            width: 0%;
            background: linear-gradient( 90deg, #e50914, #ff8a00 );
            transition: .4s;
        }

        /* FILTER */

        .filters {
            padding: 0 5% 30px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter {
            border: none;
            padding: 10px 18px;
            border-radius: 20px;
            background: #252525;
            color: white;
            cursor: pointer;
        }

            .filter.active {
                background: #e50914;
            }

        /* GROUP */

        .group {
            padding: 0 5% 45px;
        }

        .groupTitle {
            font-size: 25px;
            margin-bottom: 18px;
        }

        /* MOVIES */

        .movies {
            display: grid;
            grid-template-columns: repeat(auto-fill,minmax(230px,1fr));
            gap: 25px;
        }

        /* CARD */

        .card {
            overflow: hidden;
            border-radius: 18px;
            background: linear-gradient( 180deg, rgba(255,255,255,.1), rgba(255,255,255,.03) );
            border: 1px solid rgba(255,255,255,.1);
            transition: .25s;
        }

            .card:hover {
                transform: translateY(-8px);
                box-shadow: 0 20px 50px rgba(0,0,0,.5);
            }

        .poster {
            width: 100%;
            height: 320px;
            object-fit: cover;
            background: #171717;
        }

        .info {
            padding: 17px;
        }

        .title {
            font-size: 19px;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .year {
            color: #999;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .description {
            color: #c8c8c8;
            font-size: 13px;
            line-height: 1.5;
            min-height: 78px;
        }

        /* STATUS */

        .status {
            display: flex;
            gap: 6px;
            margin-top: 15px;
        }

            .status button {
                flex: 1;
                border: none;
                padding: 8px 4px;
                border-radius: 8px;
                background: #292929;
                color: white;
                font-size: 11px;
                cursor: pointer;
            }

                .status button:hover {
                    background: #444;
                }

                .status button.selected {
                    background: #e50914;
                }

        /* TRAILER */

        .trailer {
            width: 100%;
            margin-top: 9px;
            padding: 10px;
            border: none;
            border-radius: 9px;
            background: white;
            color: black;
            font-weight: bold;
            cursor: pointer;
        }

            .trailer:hover {
                background: #ddd;
            }

        /* RATING */

        .rating {
            margin-top: 10px;
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .star {
            color: #555;
            font-size: 18px;
            cursor: pointer;
        }

            .star.active {
                color: #ffd21f;
            }

        /* ERROR */

        .error {
            margin: 40px 5%;
            padding: 25px;
            border-radius: 15px;
            background: rgba(255,0,0,.1);
            border: 1px solid rgba(255,0,0,.3);
            color: #ffb0b0;
        }

        /* MOBILE */

        @media(max-width:600px) {

            .movies {
                grid-template-columns: repeat(2,1fr);
                gap: 12px;
            }

            .poster {
                height: 250px;
            }

            .title {
                font-size: 15px;
            }

            .description {
                font-size: 11px;
            }

            .status button {
                font-size: 9px;
            }
        }
    </style>
</head>


<body>


    <header>

        <div class="logo">
            WATCH<span>LIST</span>
        </div>

        <button class="back"
                onclick="location.href='index.html'">

            ← Profiles

        </button>

    </header>


    <section class="hero">

        <h1 id="title">
            Loading...
        </h1>

        <p id="description">
            Loading universe...
        </p>

    </section>


    <section class="progress">

        <div class="progressTop">

            <span id="count">
                0 / 0 watched
            </span>

            <span id="percent">
                0%
            </span>

        </div>

        <div class="progressBar">

            <div id="progressFill"
                 class="progressFill">
            </div>

        </div>

    </section>


    <div class="filters">

        <button class="filter active"
                onclick="filterMovies('all',this)">
            All
        </button>

        <button class="filter"
                onclick="filterMovies('unwatched',this)">
            Unwatched
        </button>

        <button class="filter"
                onclick="filterMovies('watched',this)">
            Watched
        </button>

        <button class="filter"
                onclick="filterMovies('half',this)">
            Half Completed
        </button>

    </div>


    <main id="content"></main>


    <!-- IMPORTANT -->

    <script src="data.js"></script>


    <script>

/*
==================================================
GET UNIVERSE FROM URL
==================================================
*/

const params =
    new URLSearchParams(
        window.location.search
    );

const universeId =
    params.get("universe");


/*
==================================================
FIND UNIVERSE FROM YOUR ACTUAL DATA.JS
==================================================
*/

const universe =
    UNIVERSES.find(
        u => u.id === universeId
    );


/*
==================================================
CHECK
==================================================
*/

if (!universe) {

    document.getElementById("title")
        .textContent =
        "Universe Not Found";

    document.getElementById("description")
        .textContent =
        "Could not find: " + universeId;

    document.getElementById("content")
        .innerHTML = `

            <div class="error">

                <h2>Universe not found</h2>

                <br>

                <p>
                    Looking for:
                    <strong>
                        ${universeId}
                    </strong>
                </p>

                <br>

                <p>
                    Check the id inside data.js.
                </p>

            </div>

        `;

} else {

    loadUniverse();

}


/*
==================================================
LOCAL STORAGE
==================================================
*/

let state =
    JSON.parse(
        localStorage.getItem(
            "watchlist-progress"
        ) || "{}"
    );


/*
==================================================
SAVE
==================================================
*/

function save() {

    localStorage.setItem(
        "watchlist-progress",
        JSON.stringify(state)
    );

}


/*
==================================================
MOVIE ID
==================================================
*/

function movieKey(movie) {

    return movie.id;

}


/*
==================================================
GET STATUS
==================================================
*/

function getStatus(movie) {

    return (
        state[movieKey(movie)] ||
        "unwatched"
    );

}


/*
==================================================
SET STATUS
==================================================
*/

function setStatus(movie,status) {

    state[movieKey(movie)] =
        status;

    save();

    loadUniverse();

}


/*
==================================================
RATING
==================================================
*/

function getRating(movie) {

    return Number(
        localStorage.getItem(
            "rating-" +
            movieKey(movie)
        ) || 0
    );

}


function setRating(movie,rating) {

    localStorage.setItem(

        "rating-" +
        movieKey(movie),

        rating

    );

    loadUniverse();

}


/*
==================================================
FILTER
==================================================
*/

let currentFilter = "all";


function filterMovies(filter,button) {

    currentFilter =
        filter;


    document
        .querySelectorAll(".filter")
        .forEach(
            b =>
            b.classList.remove("active")
        );


    button.classList.add("active");


    loadUniverse();

}


/*
==================================================
GET ALL ITEMS
==================================================
*/

function getAllItems() {

    let all = [];


    universe.groups.forEach(
        group => {

            group.items.forEach(
                movie => {

                    all.push(movie);

                }
            );

        }
    );


    return all;

}


/*
==================================================
LOAD UNIVERSE
==================================================
*/

function loadUniverse() {

    /*
    TITLE
    */

    document.getElementById(
        "title"
    ).textContent =
        universe.name;


    /*
    DESCRIPTION
    */

    document.getElementById(
        "description"
    ).textContent =
        universe.tagline ||
        "Your personal " +
        universe.name +
        " watchlist.";


    /*
    PROGRESS
    */

    updateProgress();


    /*
    CONTENT
    */

    const content =
        document.getElementById(
            "content"
        );


    content.innerHTML = "";


    /*
    GROUPS
    */

    universe.groups.forEach(
        group => {

            const section =
                document.createElement(
                    "section"
                );


            section.className =
                "group";


            const heading =
                document.createElement(
                    "h2"
                );


            heading.className =
                "groupTitle";


            heading.textContent =
                group.title;


            section.appendChild(
                heading
            );


            const grid =
                document.createElement(
                    "div"
                );


            grid.className =
                "movies";


            group.items.forEach(
                movie => {

                    const status =
                        getStatus(movie);


                    /*
                    FILTER
                    */

                    if (
                        currentFilter ===
                        "watched" &&
                        status !== "watched"
                    ) {
                        return;
                    }


                    if (
                        currentFilter ===
                        "unwatched" &&
                        status !== "unwatched"
                    ) {
                        return;
                    }


                    if (
                        currentFilter ===
                        "half" &&
                        status !== "half"
                    ) {
                        return;
                    }


                    grid.appendChild(
                        createCard(movie)
                    );

                }
            );


            section.appendChild(
                grid
            );


            content.appendChild(
                section
            );

        }
    );

}


/*
==================================================
CREATE CARD
==================================================
*/

function createCard(movie) {

    const card =
        document.createElement(
            "article"
        );


    card.className =
        "card";


    const status =
        getStatus(movie);


    const rating =
        getRating(movie);


    /*
    IMAGE
    */

    const image =
        movie.image ||
        movie.poster ||
        "https://via.placeholder.com/500x750/151515/ffffff?text=" +
        encodeURIComponent(
            movie.title
        );


    /*
    DESCRIPTION
    */

    const description =
        movie.description ||
        "Description coming soon.";


    /*
    TRAILER
    */

    const trailer =
        movie.trailer ||
        (
            "https://www.youtube.com/results?search_query=" +
            encodeURIComponent(
                movie.title +
                " official trailer"
            )
        );


    card.innerHTML = `

        <img
            class="poster"
            src="${image}"
            alt="${escapeHTML(movie.title)}"
            onerror="
                this.src='https://via.placeholder.com/500x750/151515/ffffff?text=No+Poster'
            "
        >

        <div class="info">

            <div class="title">
                ${escapeHTML(movie.title)}
            </div>

            <div class="year">
                ${movie.year || ""}
            </div>

            <div class="description">
                ${escapeHTML(description)}
            </div>


            <div class="status">

                <button
                    class="${status === "unwatched" ? "selected" : ""}"
                    data-status="unwatched">

                    Not Watched

                </button>

                <button
                    class="${status === "half" ? "selected" : ""}"
                    data-status="half">

                    Half

                </button>

                <button
                    class="${status === "watched" ? "selected" : ""}"
                    data-status="watched">

                    Watched

                </button>

            </div>


            <button
                class="trailer">

                ▶ Watch Trailer

            </button>


            <div class="rating">

                <span>Rating:</span>

                ${createStars(movie,rating)}

            </div>

        </div>

    `;


    /*
    STATUS BUTTONS
    */

    card
        .querySelectorAll(
            ".status button"
        )
        .forEach(
            button => {

                button.addEventListener(
                    "click",
                    () => {

                        setStatus(
                            movie,
                            button.dataset.status
                        );

                    }
                );

            }
        );


    /*
    TRAILER
    */

    card
        .querySelector(
            ".trailer"
        )
        .addEventListener(
            "click",
            () => {

                window.open(
                    trailer,
                    "_blank"
                );

            }
        );


    /*
    RATING
    */

    card
        .querySelectorAll(
            ".star"
        )
        .forEach(
            star => {

                star.addEventListener(
                    "click",
                    () => {

                        setRating(
                            movie,
                            Number(
                                star.dataset.rating
                            )
                        );

                    }
                );

            }
        );


    return card;

}


/*
==================================================
STARS
==================================================
*/

function createStars(movie,rating) {

    let html = "";


    for (
        let i = 1;
        i <= 5;
        i++
    ) {

        html += `

            <span
                class="star ${i <= rating ? "active" : ""}"
                data-rating="${i}">

                ★

            </span>

        `;

    }


    return html;

}


/*
==================================================
PROGRESS
==================================================
*/

function updateProgress() {

    const all =
        getAllItems();


    const total =
        all.length;


    let watched = 0;


    all.forEach(
        movie => {

            if (
                getStatus(movie) ===
                "watched"
            ) {

                watched++;

            }

        }
    );


    const percentage =
        total === 0
        ? 0
        : Math.round(
            watched /
            total *
            100
        );


    document.getElementById(
        "count"
    ).textContent =
        watched +
        " / " +
        total +
        " watched";


    document.getElementById(
        "percent"
    ).textContent =
        percentage +
        "%";


    document.getElementById(
        "progressFill"
    ).style.width =
        percentage +
        "%";

}


/*
==================================================
HTML ESCAPE
==================================================
*/

function escapeHTML(text) {

    return String(text || "")
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}

    </script>

</body>
</html>
